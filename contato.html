<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="imagens/icon header.jpg"> 
    <link rel="stylesheet" href="estilo-contato.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-rounded/css/uicons-solid-rounded.css">
    <title>Contato - Café, gatos e crochê</title>
</head>
<body>

    <a href="index.html" class="link-voltar">
        <i class="fi fi-sr-undo"></i> Voltar 
    </a>

    <div class="order" id="Order">
        <h1><span>Entre em</span> Contato</h1> 

        <div class="order_main">
            
            <form action="https://formspree.io/f/SEU_ID_DO_FORMSPREE" method="POST" class="contato-form">
                <h2>Envie uma mensagem</h2>
                
                <div class="input-group">
                    <label for="nome">Seu Nome:</label>
                    <input type="text" id="nome" name="name" placeholder="Digite seu nome" required>
                </div>

                <div class="input-group">
                    <label for="email">Seu E-mail:</label>
                    <input type="email" id="email" name="_replyto" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="message" rows="5" placeholder="Quais peças você deseja encomendar?" required></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar E-mail</button>
            </form>

            <div class="info-sidebar">
                
                <div class="order_image">
                    <img src="imagens/amigos.png" alt="Ilustração">
                </div> 

                <div class="footer_main">
                    <div class="footer_tag">
                        <h2>Localização</h2>
                        <p>Brasil</p>
                    </div>

                    <div class="footer_tag">
                        <h2>Contato</h2>
                        <p><i class="fi fi-sr-phone-call"></i> +55 11 95902-4659</p>
                        <p><i class="fi fi-sr-envelope"></i> oana6926@gmail.com</p>
                    </div>

                    <div class="footer_tag redes-sociais">
                        <h2>Me siga nas redes sociais</h2>
                        
                        <div class="rede-item">
                            <img width="50" height="50" src="https://img.icons8.com/bubbles/100/instagram-new--v1.png" alt="Instagram"/>
                            <a href="https://www.instagram.com/ana_carolina_oliveiradossantos/" target="_blank">@ana_carolina_oliveiradossantos</a>
                        </div>
                        
                        <div class="rede-item">
                            <img width="50" height="50" src="https://img.icons8.com/bubbles/100/tiktok.png" alt="TikTok"/>
                            <a href="https://www.tiktok.com/@anaoliveira4030" target="_blank">@anaoliveira4030</a>
                        </div>
                    </div>
                </div>

            </div> </div> </div> </body>
</html>
